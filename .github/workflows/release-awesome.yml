name: Build & Release Prebuilt Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-awesome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install zip tool
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and run awesome-features tests
        run: |
          npm run hydrate:model-data
          npm run build:offline
          npx tsc -p packages/coding-agent/tsconfig.build.json --noEmit
          npm --prefix packages/coding-agent exec -- vitest run test/awesome-features.test.ts test/theme-controller.test.ts test/interactive-mode-paste.test.ts test/first-time-setup-fork.test.ts test/config-schemas.test.ts test/builtin-tool-strict-mode.test.ts

      - name: Build standalone binaries for all platforms
        run: |
          chmod +x scripts/build-binaries.sh
          ./scripts/build-binaries.sh --skip-install --skip-build --out release-assets

      - name: Smoke-test Linux x64 binary
        run: |
          ./release-assets/linux-x64/pi --version

      - name: Prepare version metadata
        run: |
          set -euo pipefail
          cd release-assets
          PKG_VERSION="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("../packages/coding-agent/package.json", "utf8")).version)')"
          cat > version.json <<EOF
          {
            "version": "${PKG_VERSION}",
            "sha": "${GITHUB_SHA}",
            "tag": "latest",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-assets
          path: |
            release-assets/pi-linux-x64.tar.gz
            release-assets/pi-linux-arm64.tar.gz
            release-assets/pi-darwin-arm64.tar.gz
            release-assets/pi-darwin-x64.tar.gz
            release-assets/pi-windows-x64.zip
            release-assets/pi-windows-arm64.zip
            release-assets/version.json

  build-windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Windows Desktop App (x64 & arm64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path desktop-assets | Out-Null
          foreach ($arch in @("x64", "arm64")) {
            $outDir = "out-$arch"
            dotnet publish apps/windows-desktop/PiAwesome.csproj -c Release -r "win-$arch" -o $outDir
            Compress-Archive -Path "$outDir\PiAwesome.exe" -DestinationPath "desktop-assets\pi-desktop-windows-$arch.zip" -Force
          }

      - name: Upload Windows Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-assets
          path: |
            desktop-assets/pi-desktop-windows-x64.zip
            desktop-assets/pi-desktop-windows-arm64.zip

  build-android-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android Release APK
        run: |
          gradle -p apps/android-launcher assembleRelease
          mkdir -p android-assets
          cp apps/android-launcher/app/build/outputs/apk/release/app-release.apk android-assets/pi-awesome-android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-assets
          path: android-assets/pi-awesome-android.apk

  publish-release:
    needs: [build-cli, build-windows-desktop, build-android-launcher]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum \
            pi-linux-x64.tar.gz \
            pi-linux-arm64.tar.gz \
            pi-darwin-arm64.tar.gz \
            pi-darwin-x64.tar.gz \
            pi-windows-x64.zip \
            pi-windows-arm64.zip \
            pi-desktop-windows-x64.zip \
            pi-desktop-windows-arm64.zip \
            pi-awesome-android.apk \
            version.json > SHA256SUMS

      - name: Publish rolling latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin latest

          PKG_VERSION="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("packages/coding-agent/package.json", "utf8")).version)')"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          NOTES="Prebuilt standalone binaries, Windows Desktop Web UI app, and Android Termux Launcher APK for **awesome-pi-agent** v${PKG_VERSION} (\`${SHORT_SHA}\`).\n\nInstall CLI:\n\`\`\`bash\ncurl -fsSL https://raw.githubusercontent.com/Gl1ch5555/awesome-pi-agent/main/install.sh | bash\n\`\`\`"

          ASSETS=(
            release-assets/pi-linux-x64.tar.gz
            release-assets/pi-linux-arm64.tar.gz
            release-assets/pi-darwin-arm64.tar.gz
            release-assets/pi-darwin-x64.tar.gz
            release-assets/pi-windows-x64.zip
            release-assets/pi-windows-arm64.zip
            release-assets/pi-desktop-windows-x64.zip
            release-assets/pi-desktop-windows-arm64.zip
            release-assets/pi-awesome-android.apk
            release-assets/version.json
            release-assets/SHA256SUMS
          )

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "latest (${PKG_VERSION} @ ${SHORT_SHA})" --notes "$(printf '%b' "$NOTES")"
            gh release upload latest --clobber "${ASSETS[@]}"
          else
            gh release create latest \
              --title "latest (${PKG_VERSION} @ ${SHORT_SHA})" \
              --notes "$(printf '%b' "$NOTES")" \
              "${ASSETS[@]}"
          fi
